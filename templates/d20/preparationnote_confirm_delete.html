{% extends "base.html" %}

{% block title %}Delete note{% endblock %}

{% block content %}
  <div class="narrow">
    <p class="breadcrumb">
      <a href="{{ preparationnote.campaign.get_absolute_url }}">{{ preparationnote.campaign.title }}</a> /
      <a href="{{ preparationnote.get_absolute_url }}">{{ preparationnote.title }}</a>
    </p>
    <h1>Delete note?</h1>
    <div class="card">
      <p>The note <strong>{{ preparationnote.title }}</strong> will be deleted for everyone in the campaign.</p>
      <form method="post" action="">
        {% csrf_token %}
        <div class="form-actions">
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a class="btn btn-ghost" href="{{ preparationnote.get_absolute_url }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
