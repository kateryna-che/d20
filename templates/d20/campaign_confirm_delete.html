{% extends "base.html" %}

{% block title %}Delete campaign | D20{% endblock %}

{% block content %}
  <section class="card form-card">
    <h1>Delete campaign</h1>
    <p>Delete <strong>{{ campaign.title }}</strong>?</p>
    <p>This also deletes its game sessions and memberships. This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <div class="actions">
        <button class="button danger" type="submit">Delete campaign</button>
        <a class="button secondary" href="{% url 'd20:campaign-detail' campaign.pk %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
