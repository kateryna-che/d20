{% extends "base.html" %}

{% block title %}Delete session | D20{% endblock %}

{% block content %}
  <section class="card form-card">
    <h1>Delete session</h1>
    <p>Delete <strong>{{ gamesession.title }}</strong> from {{ gamesession.campaign.title }}?</p>
    <p>This also deletes the attendance responses for this session.</p>
    <form method="post">
      {% csrf_token %}
      <div class="actions">
        <button class="button danger" type="submit">Delete session</button>
        <a class="button secondary" href="{% url 'd20:session-detail' gamesession.pk %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
