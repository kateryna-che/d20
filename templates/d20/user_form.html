{% extends "base.html" %}

{% block title %}Edit profile{% endblock %}

{% block content %}
  <div class="narrow">
    <p class="breadcrumb"><a href="{{ user.get_absolute_url }}">My profile</a></p>
    <h1>Edit profile</h1>
    <div class="card">
      <form method="post" action="" novalidate>
        {% csrf_token %}
        {% include "d20/includes/form.html" %}
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <a class="btn btn-ghost" href="{{ user.get_absolute_url }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
