<form method="get" class="filters">
  <div class="filter">
    {{ search_form.search }}
    {{ search_form.search.errors }}
  </div>
  <div class="filter-actions">
    <button type="submit" class="btn btn-primary">Search</button>
    {% if search_query %}
      <a class="btn btn-ghost" href="{{ request.path }}">Reset</a>
    {% endif %}
  </div>
</form>
