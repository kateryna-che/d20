<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if not field.field.required %} <span class="optional">(optional)</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
    <div class="help">{{ field.help_text|safe }}</div>
  {% endif %}
  {{ field.errors }}
</div>
