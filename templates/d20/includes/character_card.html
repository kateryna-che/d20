<article class="card card-link">
  <span class="weapon weapon-{{ character.character_class }}" aria-hidden="true"></span>
  <div class="card-lead">
    {% include "d20/includes/token.html" %}
    <div>
      <h2 class="card-title"><a href="{{ character.get_absolute_url }}">{{ character.name }}</a></h2>
      <p class="meta">
        <span>{{ character.summary }}</span>
      </p>
    </div>
  </div>
  {% if character.concept %}
    <p class="clamp">{{ character.concept }}</p>
  {% endif %}
  {% if character.owner_id == user.pk %}
    <p class="meta card-foot">
      <a href="{% url 'd20:character-update' pk=character.pk %}?next={{ request.get_full_path|urlencode }}">Edit sheet</a>
    </p>
  {% endif %}
</article>
