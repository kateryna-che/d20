{% extends "base.html" %}

{% block title %}Delete character | D20{% endblock %}

{% block content %}
  <section class="card form-card">
    <h1>Delete character</h1>
    <p>Delete <strong>{{ character.name }}</strong>?</p>
    <p>Campaign memberships will no longer have this character selected.</p>
    <form method="post">
      {% csrf_token %}
      <div class="actions">
        <button class="button danger" type="submit">Delete character</button>
        <a class="button secondary" href="{% url 'd20:character-detail' character.pk %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
